name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite bundle and macOS .dmg installers (arm64 M1+, x64 Intel, universal)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac

      - name: Upload macOS DMG & ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KinezioAtlas-macOS-Installers
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
